<head>
  <meta charset="UTF-8" />

  <title>discord.gg/883</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <style>
    :root {
      --accent: #9f8663;
      --glow: rgba(255,255,255,.8);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top left, #1a1a1a 0%, #2e2e3a 30%, #000000 70%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, 'Courier New', monospace;
      color: var(--accent);
      display: grid;
      place-items: center;
      text-align: center;
      overflow: hidden;
    }
    #content {
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .8s ease, transform .8s ease;
      max-width: min(92vw, 560px);
      position: relative;
      z-index: 1;
    }
    #content.ready { opacity: 1; transform: translateY(0); }
    .card img {
      width: 100%;
      height: auto;
      border: 2px solid #c2c2c2;
      border-radius: 16px;
      box-shadow: 0 0 15px var(--glow);
      display: block;
    }
    .info {
      margin-top: 18px;
      font-size: clamp(16px, 2.2vw, 22px);
      color: #fff;
      text-shadow: 0 0 8px #fff, 0 0 15px #fff, 0 0 25px #fff;
      letter-spacing: 2.5px;
      white-space: pre-wrap;
      line-height: 1.35;
    }
    .title {
      margin-top: 6px;
      font-size: clamp(36px, 7vw, 72px);
      color: #fff;
      text-shadow: 0 0 8px #fff, 0 0 15px #fff, 0 0 25px #fff;
      letter-spacing: 4.5px;
      font-weight: 700;
    }
    .row { margin-top: 16px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn {
      appearance: none; border: 0; cursor: pointer;
      padding: 10px 16px; border-radius: 999px; font-weight: 700;
      background: #ffffff12; color: #fff; backdrop-filter: blur(6px);
      box-shadow: 0 3px 18px #00000080, inset 0 0 0 1px #ffffff26;
      user-select: none;
      transition: transform .1s ease, box-shadow .2s ease, background .2s ease;
    }
    .btn:hover { transform: translateY(-1px); background: #ffffff1f; }
    .btn:active { transform: translateY(0); }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    /* Audio CTA overlay (shown only if autoplay is blocked) */
    #audio-cta {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at center, #000000dd, #000000f2);
      z-index: 2;
      opacity: 0;
      visibility: hidden;
      transition: opacity .25s ease, visibility .25s ease;
    }
    #audio-cta.visible { opacity: 1; visibility: visible; }
    #audio-cta .panel {
      padding: 18px 22px;
      border-radius: 14px;
      background: #131313;
      color: #fff;
      box-shadow: 0 8px 32px #000000cc, inset 0 0 0 1px #ffffff1a;
      max-width: 90vw;
    }
    #audio-cta h2 { margin: 0 0 8px 0; font-size: 22px; }
    #audio-cta p  { margin: 0 0 14px 0; opacity: .85; }
  </style>
