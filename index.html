<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0ZZ // NETWORK</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #030303;
    color: #ff1a1a;
    font-family: "Courier New", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Background */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        linear-gradient(rgba(255,0,0,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,0,0,.04) 1px, transparent 1px);
    background-size: 45px 45px;
    animation: grid 8s linear infinite;
}

@keyframes grid {
    from { transform: translateY(0); }
    to { transform: translateY(45px); }
}

/* Scanlines */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(255,0,0,.025) 4px
    );
}

/* Floating particles */
.particle {
    position: fixed;
    width: 3px;
    height: 3px;
    background: #ff0000;
    box-shadow: 0 0 12px #ff0000;
    border-radius: 50%;
    animation: float 5s linear infinite;
}

.p1 { left: 10%; animation-delay: 0s; }
.p2 { left: 25%; animation-delay: 1s; }
.p3 { left: 40%; animation-delay: 2s; }
.p4 { left: 60%; animation-delay: .5s; }
.p5 { left: 75%; animation-delay: 1.5s; }
.p6 { left: 90%; animation-delay: 3s; }

@keyframes float {
    from {
        top: 110%;
        opacity: 0;
    }
    20% { opacity: 1; }
    to {
        top: -10%;
        opacity: 0;
    }
}

/* Main */
.container {
    position: relative;
    z-index: 2;
    width: min(900px, 90%);
    padding: 60px 40px;
    text-align: center;
    border: 1px solid rgba(255,0,0,.5);
    background: rgba(5,5,5,.85);
    box-shadow:
        0 0 40px rgba(255,0,0,.15),
        inset 0 0 40px rgba(255,0,0,.04);
    backdrop-filter: blur(8px);
}

.status {
    font-size: 13px;
    letter-spacing: 5px;
    color: #888;
    margin-bottom: 20px;
}

.status span {
    color: #ff0000;
}

.title {
    font-size: clamp(45px, 8vw, 90px);
    font-weight: 900;
    letter-spacing: 12px;
    color: #fff;
    text-shadow:
        0 0 5px #fff,
        0 0 20px #ff0000,
        0 0 50px rgba(255,0,0,.7);
    animation: glitch 2s infinite;
}

@keyframes glitch {
    0%, 90%, 100% {
        transform: translate(0);
    }
    92% {
        transform: translate(-3px, 2px);
    }
    94% {
        transform: translate(3px, -2px);
    }
}

.line {
    width: 180px;
    height: 2px;
    background: #ff0000;
    box-shadow: 0 0 15px #ff0000;
    margin: 25px auto;
}

.subtitle {
    color: #777;
    letter-spacing: 4px;
    font-size: 13px;
    margin-bottom: 45px;
}

/* Discord buttons */
.links {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}

.discord {
    position: relative;
    min-width: 280px;
    padding: 20px 30px;
    color: #fff;
    text-decoration: none;
    border: 1px solid #ff0000;
    background: rgba(255,0,0,.04);
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 2px;
    transition: .3s;
    overflow: hidden;
}

.discord::before {
    content: "";
    position: absolute;
    left: -100%;
    top: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,0,0,.25),
        transparent
    );
    transition: .5s;
}

.discord:hover::before {
    left: 100%;
}

.discord:hover {
    color: #fff;
    background: #ff0000;
    box-shadow:
        0 0 15px #ff0000,
        0 0 40px rgba(255,0,0,.5);
    transform: translateY(-5px);
}

.footer {
    margin-top: 45px;
    color: #333;
    font-size: 11px;
    letter-spacing: 3px;
}

.footer span {
    color: #ff0000;
}
</style>
</head>

<body>

<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>
<div class="particle p5"></div>
<div class="particle p6"></div>

<div class="container">

    <div class="status">
        SYSTEM STATUS // <span>ONLINE</span>
    </div>

    <div class="title">0ZZ</div>

    <div class="line"></div>

    <div class="subtitle">
        WELCOME TO THE NETWORK
    </div>

    <div class="links">
        <a class="discord"
           href="https://discord.gg/0zz"
           target="_blank">
            زب اكس ون هنااا
        </a>

        <a class="discord"
           href="https://discord.gg/mt3"
           target="_blank">
            discord.gg/mt3
        </a>
    </div>

    <div class="footer">
        ACCESS GRANTED // <span>0ZZ</span>
    </div>

</div>

</body>
</html>
